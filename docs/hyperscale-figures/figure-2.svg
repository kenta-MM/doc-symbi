<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc"><title id="title">図2：必要なページを段階的に取得</title><desc id="desc">メモリにないページをRBPEXで探し、そこにもなければPage Serverへ要求する。要求LSNに達するまで待機する場合があり、取得後はComputeでクエリを処理する。</desc><defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3174b8"/></marker><marker id="log" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ac6418"/></marker></defs><rect width="1000" height="920" rx="18" fill="white"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1c3545"><text x="40" y="48" font-size="28" font-weight="700">02  必要なページを段階的に取得</text><text x="40" y="83" font-size="16" fill="#526878">読み取り経路  /  キャッシュヒットとリモート読み取り</text><g id="relation-1"><path d="M295 246 V350" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" /><text x="380" y="300" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">キャッシュミス</text></g><g id="relation-2"><path d="M295 436 V550" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" /><text x="380" y="495" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">キャッシュミス</text></g><g id="relation-3"><path d="M510 203 H810 V350" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" /><text x="680" y="185" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">ヒット</text></g><g id="relation-4"><path d="M510 393 H680" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" /><text x="590" y="375" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">ヒット</text></g><g id="relation-5"><path d="M510 600 H810 V450" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" /><text x="730" y="625" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">LSN確認後に返す</text></g><g id="relation-6"><path d="M940 400 H965 V743 H940" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" /><text x="900" y="680" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">結果</text></g><g id="memory"><rect x="80" y="160" width="430" height="86" rx="14" fill="#eaf3ff" stroke="#3174b8" stroke-width="2"/><text x="295" y="210" text-anchor="middle" font-size="23" font-weight="600">メモリ / Buffer Pool</text></g><g id="rbpex"><rect x="80" y="350" width="430" height="86" rx="14" fill="#eaf3ff" stroke="#3174b8" stroke-width="2"/><text x="295" y="400" text-anchor="middle" font-size="23" font-weight="600">ローカルSSD / RBPEX</text></g><g id="pages"><rect x="80" y="550" width="430" height="100" rx="14" fill="#e7f5ed" stroke="#287254" stroke-width="2"/><text x="295" y="607" text-anchor="middle" font-size="23" font-weight="600">Page Server</text></g><g id="query"><rect x="680" y="350" width="260" height="100" rx="14" fill="#eaf3ff" stroke="#3174b8" stroke-width="2"/><text x="810" y="407" text-anchor="middle" font-size="23" font-weight="600">Compute でクエリ処理</text></g><g id="result"><rect x="680" y="700" width="260" height="86" rx="14" fill="#eaf3ff" stroke="#3174b8" stroke-width="2"/><text x="810" y="750" text-anchor="middle" font-size="23" font-weight="600">アプリへ結果を返す</text></g><line x1="40" y1="855" x2="960" y2="855" stroke="#dce5eb"/><text x="40" y="883" font-size="15" fill="#526878">青：ページ取得・利用関係  橙：ログ／レプリケーション  緑の枠：保存層</text><text x="40" y="907" font-size="13" fill="#657887">Microsoft Learn に基づく概念図 · 2026-10-26 · 物理配置や冗長台数は省略</text></g></svg>