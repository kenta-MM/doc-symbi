<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc"><title id="title">図4：読み取り分散と地域障害への備え</title><desc id="desc">Region AのPrimary・HA・Namedは同じPage Serverを共有する。Region BのGeo replicaは独立したPage ServerとStorageを持ち、非同期レプリケーションで追従する。</desc><defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3174b8"/></marker><marker id="log" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ac6418"/></marker></defs><rect width="1000" height="920" rx="18" fill="white"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1c3545"><text x="40" y="48" font-size="28" font-weight="700">04  読み取り分散と地域障害への備え</text><text x="40" y="83" font-size="16" fill="#526878">レプリカ構成  /  共有ストレージと独立ストレージの違い</text><rect x="30" y="155" width="440" height="675" rx="16" fill="#f5f8fc" stroke="#bdcfe0"/><rect x="540" y="155" width="420" height="675" rx="16" fill="#f2faf6" stroke="#bbd9c9"/><text x="50" y="184" font-size="18" fill="#526878">Region A</text><text x="560" y="184" font-size="18" fill="#526878">Region B</text><g id="relation-1"><path d="M150 200 V130 H750 V200" fill="none" stroke="#ac6418" stroke-width="3" marker-end="url(#log)" /><text x="510" y="115" text-anchor="middle" font-size="17" fill="#ac6418" stroke="#fff" stroke-width="5" paint-order="stroke">非同期レプリケーション</text></g><g id="relation-2"><path d="M150 286 V320 H50 V593 H70" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" /><text x="125" y="525" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">共有ストレージ</text></g><g id="relation-3"><path d="M350 286 V320 H450 V593 H430" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" /><text x="385" y="525" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">共有</text></g><g id="relation-4"><path d="M250 456 V550" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" /><text x="305" y="500" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">共有</text></g><g id="relation-5"><path d="M250 636 V720" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" /><text x="310" y="685" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">保存</text></g><g id="relation-6"><path d="M750 286 V550" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" /><text x="830" y="425" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">独立ストレージ</text></g><g id="relation-7"><path d="M750 636 V720" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" /><text x="810" y="685" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">保存</text></g><g id="primary"><rect x="70" y="200" width="160" height="86" rx="14" fill="#eaf3ff" stroke="#3174b8" stroke-width="2"/><text x="150" y="250" text-anchor="middle" font-size="20" font-weight="600">Primary</text></g><g id="ha"><rect x="270" y="200" width="160" height="86" rx="14" fill="#eaf3ff" stroke="#3174b8" stroke-width="2"/><text x="350" y="250" text-anchor="middle" font-size="20" font-weight="600">HA replica</text></g><g id="named"><rect x="70" y="370" width="360" height="86" rx="14" fill="#eaf3ff" stroke="#3174b8" stroke-width="2"/><text x="250" y="420" text-anchor="middle" font-size="23" font-weight="600">Named replica</text></g><g id="pagesA"><rect x="70" y="550" width="360" height="86" rx="14" fill="#e7f5ed" stroke="#287254" stroke-width="2"/><text x="250" y="600" text-anchor="middle" font-size="23" font-weight="600">共有 Page Servers A</text></g><g id="storageA"><rect x="70" y="720" width="360" height="86" rx="14" fill="#e7f5ed" stroke="#287254" stroke-width="2"/><text x="250" y="770" text-anchor="middle" font-size="23" font-weight="600">Storage A</text></g><g id="geo"><rect x="580" y="200" width="340" height="86" rx="14" fill="#eaf3ff" stroke="#3174b8" stroke-width="2"/><text x="750" y="250" text-anchor="middle" font-size="23" font-weight="600">Geo replica</text></g><g id="pagesB"><rect x="580" y="550" width="340" height="86" rx="14" fill="#e7f5ed" stroke="#287254" stroke-width="2"/><text x="750" y="600" text-anchor="middle" font-size="23" font-weight="600">独立 Page Servers B</text></g><g id="storageB"><rect x="580" y="720" width="340" height="86" rx="14" fill="#e7f5ed" stroke="#287254" stroke-width="2"/><text x="750" y="770" text-anchor="middle" font-size="23" font-weight="600">Storage B</text></g><line x1="40" y1="855" x2="960" y2="855" stroke="#dce5eb"/><text x="40" y="883" font-size="15" fill="#526878">青：ページ取得・利用関係  橙：ログ／レプリケーション  緑の枠：保存層</text><text x="40" y="907" font-size="13" fill="#657887">Microsoft Learn に基づく概念図 · 2026-10-26 · 物理配置や冗長台数は省略</text></g></svg>