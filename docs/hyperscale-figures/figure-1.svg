<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc"><title id="title">図1：処理・ログ・保存の分離</title><desc id="desc">Primary が更新を処理し、Log Service が変更ログをページサーバーと読み取りレプリカへ配布する。Compute は Page Server から必要なページを取得し、永続データは Azure Storage に保存される。</desc><defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3174b8"/></marker><marker id="log" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ac6418"/></marker></defs><rect width="1000" height="920" rx="18" fill="white"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1c3545"><text x="40" y="48" font-size="28" font-weight="700">01  処理・ログ・保存の分離</text><text x="40" y="83" font-size="16" fill="#526878">全体構成  /  Compute・Log Service・Page Server・Azure Storage</text><g id="relation-1"><path d="M165 206 V300" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" /><text x="190" y="255" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">読み書き</text></g><g id="relation-2"><path d="M835 206 V300" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" /><text x="850" y="255" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">読み取り</text></g><g id="relation-3"><path d="M280 343 H385" fill="none" stroke="#ac6418" stroke-width="3" marker-end="url(#log)" /><text x="330" y="327" text-anchor="middle" font-size="17" fill="#ac6418" stroke="#fff" stroke-width="5" paint-order="stroke">ログ</text></g><g id="relation-4"><path d="M615 343 H720" fill="none" stroke="#ac6418" stroke-width="3" marker-end="url(#log)" /><text x="665" y="327" text-anchor="middle" font-size="17" fill="#ac6418" stroke="#fff" stroke-width="5" paint-order="stroke">ログ</text></g><g id="relation-5"><path d="M500 386 V520" fill="none" stroke="#ac6418" stroke-width="3" marker-end="url(#log)" /><text x="535" y="458" text-anchor="middle" font-size="17" fill="#ac6418" stroke="#fff" stroke-width="5" paint-order="stroke">ログ適用</text></g><g id="relation-6"><path d="M165 386 V563 H385" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" marker-start="url(#data)"/><text x="210" y="540" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">ページ取得</text></g><g id="relation-7"><path d="M835 386 V563 H615" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" marker-start="url(#data)"/><text x="785" y="540" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">ページ取得</text></g><g id="relation-8"><path d="M500 606 V700" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" /><text x="560" y="659" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">データ保存</text></g><g id="relation-9"><path d="M410 386 V460 H70 V700" fill="none" stroke="#ac6418" stroke-width="3" marker-end="url(#log)" /><text x="162" y="445" text-anchor="middle" font-size="17" fill="#ac6418" stroke="#fff" stroke-width="5" paint-order="stroke">ログの長期保存</text></g><g id="app"><rect x="50" y="120" width="230" height="86" rx="14" fill="#eaf3ff" stroke="#3174b8" stroke-width="2"/><text x="165" y="170" text-anchor="middle" font-size="23" font-weight="600">更新アプリ</text></g><g id="readers"><rect x="720" y="120" width="230" height="86" rx="14" fill="#eaf3ff" stroke="#3174b8" stroke-width="2"/><text x="835" y="170" text-anchor="middle" font-size="23" font-weight="600">参照アプリ</text></g><g id="primary"><rect x="50" y="300" width="230" height="86" rx="14" fill="#eaf3ff" stroke="#3174b8" stroke-width="2"/><text x="165" y="350" text-anchor="middle" font-size="23" font-weight="600">Primary Compute</text></g><g id="log"><rect x="385" y="300" width="230" height="86" rx="14" fill="#fff0dc" stroke="#ac6418" stroke-width="2"/><text x="500" y="350" text-anchor="middle" font-size="23" font-weight="600">Log Service</text></g><g id="replicas"><rect x="720" y="300" width="230" height="86" rx="14" fill="#eaf3ff" stroke="#3174b8" stroke-width="2"/><text x="835" y="350" text-anchor="middle" font-size="23" font-weight="600">HA / Named</text></g><g id="pages"><rect x="385" y="520" width="230" height="86" rx="14" fill="#e7f5ed" stroke="#287254" stroke-width="2"/><text x="500" y="570" text-anchor="middle" font-size="23" font-weight="600">Page Servers</text></g><g id="storage"><rect x="385" y="700" width="230" height="86" rx="14" fill="#e7f5ed" stroke="#287254" stroke-width="2"/><text x="500" y="750" text-anchor="middle" font-size="23" font-weight="600">Azure Storage</text></g><g id="logs"><rect x="50" y="700" width="230" height="86" rx="14" fill="#e7f5ed" stroke="#287254" stroke-width="2"/><text x="165" y="750" text-anchor="middle" font-size="23" font-weight="600">長期ログ保存</text></g><line x1="40" y1="855" x2="960" y2="855" stroke="#dce5eb"/><text x="40" y="883" font-size="15" fill="#526878">青：ページ取得・利用関係  橙：ログ／レプリケーション  緑の枠：保存層</text><text x="40" y="907" font-size="13" fill="#657887">Microsoft Learn に基づく概念図 · 2026-10-26 · 物理配置や冗長台数は省略</text></g></svg>