<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc"><title id="title">図3：更新はログを通じて伝わる</title><desc id="desc">Primary は Log Service にログを送る。ログは Log Service で永続化され、Page Server によるデータ更新、読み取りレプリカの非同期適用、長期ログ保存につながる。</desc><defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3174b8"/></marker><marker id="log" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ac6418"/></marker></defs><rect width="1000" height="920" rx="18" fill="white"/><g font-family="Yu Gothic, Meiryo, sans-serif" fill="#1c3545"><text x="40" y="48" font-size="28" font-weight="700">03  更新はログを通じて伝わる</text><text x="40" y="83" font-size="16" fill="#526878">更新経路  /  永続化と非同期のログ適用</text><g id="relation-1"><path d="M370 203 H590" fill="none" stroke="#ac6418" stroke-width="3" marker-end="url(#log)" /><text x="475" y="183" text-anchor="middle" font-size="17" fill="#ac6418" stroke="#fff" stroke-width="5" paint-order="stroke">ログ送信</text></g><g id="relation-2"><path d="M650 260 V365 H185 V470" fill="none" stroke="#ac6418" stroke-width="3" marker-end="url(#log)" /><text x="310" y="347" text-anchor="middle" font-size="17" fill="#ac6418" stroke="#fff" stroke-width="5" paint-order="stroke">ログ配布</text></g><g id="relation-3"><path d="M740 260 V400 H500 V470" fill="none" stroke="#ac6418" stroke-width="3" marker-end="url(#log)" /><text x="625" y="424" text-anchor="middle" font-size="17" fill="#ac6418" stroke="#fff" stroke-width="5" paint-order="stroke">非同期適用</text></g><g id="relation-4"><path d="M830 260 V350 H815 V470" fill="none" stroke="#ac6418" stroke-width="3" marker-end="url(#log)" /><text x="885" y="365" text-anchor="middle" font-size="17" fill="#ac6418" stroke="#fff" stroke-width="5" paint-order="stroke">長期保存</text></g><g id="relation-5"><path d="M185 570 V700" fill="none" stroke="#3174b8" stroke-width="3" marker-end="url(#data)" /><text x="275" y="640" text-anchor="middle" font-size="17" fill="#3174b8" stroke="#fff" stroke-width="5" paint-order="stroke">データ更新</text></g><g id="primary"><rect x="70" y="160" width="300" height="86" rx="14" fill="#eaf3ff" stroke="#3174b8" stroke-width="2"/><text x="220" y="210" text-anchor="middle" font-size="23" font-weight="600">Primary Compute</text></g><g id="log"><rect x="590" y="160" width="300" height="100" rx="14" fill="#fff0dc" stroke="#ac6418" stroke-width="2"/><text x="740" y="217" text-anchor="middle" font-size="23" font-weight="600">Log Service</text></g><g id="pages"><rect x="50" y="470" width="270" height="100" rx="14" fill="#e7f5ed" stroke="#287254" stroke-width="2"/><text x="185" y="527" text-anchor="middle" font-size="23" font-weight="600">Page Servers</text></g><g id="replica"><rect x="365" y="470" width="270" height="100" rx="14" fill="#eaf3ff" stroke="#3174b8" stroke-width="2"/><text x="500" y="527" text-anchor="middle" font-size="23" font-weight="600">読み取りレプリカ</text></g><g id="logs"><rect x="680" y="470" width="270" height="100" rx="14" fill="#e7f5ed" stroke="#287254" stroke-width="2"/><text x="815" y="527" text-anchor="middle" font-size="23" font-weight="600">長期ログ保存</text></g><g id="data"><rect x="50" y="700" width="270" height="86" rx="14" fill="#e7f5ed" stroke="#287254" stroke-width="2"/><text x="185" y="750" text-anchor="middle" font-size="23" font-weight="600">データファイル</text></g><line x1="40" y1="855" x2="960" y2="855" stroke="#dce5eb"/><text x="40" y="883" font-size="15" fill="#526878">青：ページ取得・利用関係  橙：ログ／レプリケーション  緑の枠：保存層</text><text x="40" y="907" font-size="13" fill="#657887">Microsoft Learn に基づく概念図 · 2026-10-26 · 物理配置や冗長台数は省略</text></g></svg>